name: Keep Streamlit App Awake

on:
  schedule:
    # Executa a cada 6 horas para garantir que o Streamlit não durma
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite rodar manualmente a partir da aba Actions no GitHub

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Keep Alive Script
        run: python .github/workflows/keep_alive.py

      - name: Upload Status Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-status-screenshots
          path: |
            status_inicial.png
            status_final.png
          retention-days: 3
